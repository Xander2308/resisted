<style>

      let free = tower === "wall" ? Math.min(S.freeWalls, cells.length) : 0;

        { type: "shake", v: 4 }, { type: "buzz", ms: 40 }, { type: "sfx", s: "fuse" }, { type: "fuse", x: p.x, y: p.y, color: TOWERS[b.type].color });
